<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify your phone | Digaily</title>
<link rel="stylesheet" href="ocdeVerfication.css"
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;700&display=swap">
<style>

</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<div class="stage">
  <header class="glass bar">
    <a class="logo" href="Digaily main.html" aria-label="Digaily home">
      <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="11" fill="#1E4FB8"/><path d="M18 9v13M12.5 16.5L18 22l5.5-5.5M10 27h16" fill="none" stroke="#FFFBE6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Digaily</span>
    </a>
    <a class="back" href="Digaily account.html#signin">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      Back to sign in
    </a>
  </header>

  <main class="glass card" aria-labelledby="t">
    <div class="mark" aria-hidden="true">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFFBE6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6z"/><path d="M8.8 12.2l2.2 2.2 4.2-4.4"/></svg>
    </div>
    <h1 id="t">Verify your phone</h1>
    <p class="sub">We sent a 6 digit code to <b id="codeTo">your phone</b>. Enter it below to sign in.</p>

    <form id="fCode" novalidate>
      <div class="field">
        <span id="otpLabel">6 digit code</span>
        <div class="otp" id="otp" role="group" aria-labelledby="otpLabel">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder=" " autocomplete="one-time-code" aria-label="Digit 1 of 6">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder=" " autocomplete="off" aria-label="Digit 2 of 6">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder=" " autocomplete="off" aria-label="Digit 3 of 6">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder=" " autocomplete="off" aria-label="Digit 4 of 6">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder=" " autocomplete="off" aria-label="Digit 5 of 6">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder=" " autocomplete="off" aria-label="Digit 6 of 6">
        </div>
        <span class="err" id="otpE"></span>
      </div>
      <p class="demo" id="demoHint" hidden>Demo mode: no real text message is sent. Your code is <b id="demoCode"></b></p>
      <div class="msg" id="mCode" role="status" aria-live="polite"></div>
      <button class="btn primary full" type="submit" id="bCode">Verify and sign in</button>
    </form>

    <div class="resend" id="resendBox">
      <div class="resend-top">
        <span class="t" id="resendTxt"></span>
        <button class="linkbtn" type="button" id="resend" hidden>Resend code</button>
      </div>
      <div class="track" aria-hidden="true"><i id="bar"></i></div>
    </div>

    <div class="links">
      <a href="Digaily account.html#signin" id="changeNum">Change number</a>
      <a href="Digaily main.html">Continue as guest</a>
    </div>
  </main>
</div>

<div class="sr" id="live" aria-live="polite"></div>

<script src="codeVerfication.js" defer>
</script>
</body>
</html>
