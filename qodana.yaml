#-------------------------------------------------------------------------------#
#               Qodana analysis is configured by qodana.yaml file               #
#             https://www.jetbrains.com/help/qodana/qodana-yaml.html            #
#-------------------------------------------------------------------------------#
#################################################################################
#              WARNING: Do not store sensitive information in this file,        #
#               as its contents will be included in the Qodana report.          #
#################################################################################
version: "1.0"
#Specify IDE code to run analysis without container (Applied in CI/CD pipeline)
ide: QDNET
#Specify inspection profile for code analysis
profile:
  name: qodana.starter
include:
  - name: ConvertIfStatementToReturnStatement
  - name: ArrangeThisQualifier
  - name: AsyncMethodWithoutAwait
  - name: AutoPropertyCanBeMadeGetOnly.Global
  - name: HeapView.BoxingAllocation
  - name: ClassNeverInstantiated.Global
  - name: HeapView.ClosureAllocation
  - name: ConvertIfStatementToSwitchStatement
  - name: ConvertToPrimaryConstructor
  - name: ConvertToExtensionBlock
  - name: HeapView.DelegateAllocation
  - name: SassScssDeprecatedIfFunction
  - name: XmlDeprecatedElement
  - name: XmlDuplicatedId
  - name: RegExpDuplicateAlternationBranch
  - name: DuplicatedCode
  - name: EmptyRegion
  - name: FieldCanBeMadeReadOnly.Global
  - name: FieldCanBeMadeReadOnly.Local
  - name: CssInvalidFunction
  - name: CssInvalidPropertyValue
  - name: InvertIf
  - name: MemberCanBePrivate.Global
  - name: MemberCanBeProtected.Global
  - name: MergeIntoPattern
  - name: MergeIntoLogicalPattern
  - name: MergeSequentialChecks
  - name: MethodHasAsyncOverload
  - name: UnusedMethodReturnValue.Global
  - name: HtmlFormInputWithoutLabel
  - name: CssMissingComma
  - name: CssNoGenericFontName
  - name: LessResolvedByNameOnly
  - name: SassScssResolvedByNameOnly
  - name: HtmlRequiredAltAttribute
  - name: HtmlRequiredLangAttribute
  - name: HtmlRequiredTitleElement
  - name: CssNonIntegerLengthInPixels
  - name: HeapView.ObjectAllocation
  - name: HeapView.ObjectAllocation.Evident
  - name: HeapView.ObjectAllocation.Possible
  - name: HtmlDeprecatedAttribute
  - name: HtmlDeprecatedTag
  - name: CssOverwrittenProperties
  - name: ForeachCanBePartlyConvertedToQueryUsingAnotherGetEnumerator
  - name: CssReplaceWithShorthandSafely
  - name: PropertyCanBeMadeInitOnly.Global
  - name: RegExpRedundantEscape
  - name: CssRedundantUnit
  - name: RedundantVerbatimStringPrefix
  - name: RegExpSimplifiable
  - name: ConvertSwitchStatementToSwitchExpression
  - name: ReplaceWithFieldKeyword
  - name: ReplaceWithPrimaryConstructorParameter
  - name: CA1861
  - name: CA1816
  - name: CA2208
  - name: ASP0025
  - name: RouteTemplates.ParameterConstraintCanBeSpecified
  - name: RegExpSingleCharAlternation
  - name: SwitchStatementHandlesSomeKnownEnumValuesWithDefault
  - name: UnusedType.Global
  - name: UnusedMemberInSuper.Global
  - name: UnusedMember.Global
  - name: HtmlUnknownAttribute
  - name: CssUnknownProperty
  - name: HtmlUnknownTag
  - name: HtmlUnknownTarget
  - name: CssUnknownTarget
  - name: MarkdownUnresolvedFileReference
  - name: HtmlUnknownAnchorTarget
  - name: LessUnresolvedMixin
  - name: XmlUnresolvedReference
  - name: UnusedParameter.Global
  - name: CssUnusedSymbol
  - name: UseObjectOrCollectionInitializer
  - name: ArrangeNamespaceBody
  - name: ArrangeTrailingCommaInMultilineLists
  - name: ArrangeObjectCreationWhenTypeEvident
  - name: HtmlWrongAttributeValue
  - name: XMLErrors
  - name: XmlHighlighting

#Enable inspections
#include:
#  - name: <SomeEnabledInspectionId>
#Disable inspections
#exclude:
#  - name: <SomeDisabledInspectionId>
#    paths:
#      - <path/where/not/run/inspection>
#Execute shell command before Qodana execution (Applied in CI/CD pipeline)
#bootstrap: sh ./prepare-qodana.sh
#Install IDE plugins before Qodana execution (Applied in CI/CD pipeline)
#plugins:
#  - id: <plugin.id> #(plugin id can be found at https://plugins.jetbrains.com)
# Quality gate. Will fail the CI/CD pipeline if any condition is not met
# severityThresholds - configures maximum thresholds for different problem severities
# testCoverageThresholds - configures minimum code coverage on a whole project and newly added code
# dependencyLicenses - fails the run on prohibited or unknown dependency licenses
# Code Coverage is available in Ultimate and Ultimate Plus plans
#failureConditions:
#  severityThresholds:
#    any: 15
#    critical: 5
#  testCoverageThresholds:
#    fresh: 70
#    total: 50
#  dependencyLicenses:
#    failOnProhibited: true
#    failOnUnknown: false
